name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-service:
    name: voice-service (lint + unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-service
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (mocked pool)
        run: pytest -q

      - name: Integration tests (real Neon DB)
        if: env.TEST_DATABASE_URL != ''
        run: pytest -m integration -q

      - name: Skip notice (no TEST_DATABASE_URL)
        if: env.TEST_DATABASE_URL == ''
        run: echo "::warning::TEST_DATABASE_URL secret is not set — integration suite skipped. Add it under repo Settings → Secrets and variables → Actions to enable."

  dashboard:
    name: dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DATABASE_URL_UNPOOLED: postgresql://placeholder:placeholder@localhost:5432/placeholder
      VOICE_SERVICE_URL: http://localhost:8000
      VOICE_SERVICE_TOKEN: ci-placeholder
      NEXT_PUBLIC_LIVEKIT_URL: wss://placeholder.livekit.cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (next + prisma generate)
        run: npm run build
