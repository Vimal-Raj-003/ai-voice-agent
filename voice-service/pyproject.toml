[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -m 'not integration'"
markers = [
  "integration: hits a real Postgres at TEST_DATABASE_URL — run with `pytest -m integration`",
]
filterwarnings = [
  "ignore::DeprecationWarning:livekit.*",
  "ignore::DeprecationWarning:google.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
